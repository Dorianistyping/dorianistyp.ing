<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Only Player</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'w95fa', monospace;
    overflow: hidden;
  }

  #music-player {
    width: 520px;
    padding: 8px;
  }

  .player-top {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 8px;
  }

  #album-art {
    width: 60px;
    height: 60px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    border: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #000;
  }

  #album-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .info-area {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .playlist-btn {
    width: 24px;
    height: 24px;
    padding: 0;
    margin: 0;
    font-size: 14px;
    line-height: 1;
    position: absolute;
    top: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  #song-title, #song-artist {
    display: none;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  #song-title {
    font-size: 16px;
    font-weight: bold;
    margin-top: 8px;
  }

  #song-artist {
    font-size: 12px;
    margin-top: 2px;
    color: #333;
  }

  .play {
    border: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #000;
    background-color: #e0e0e0;
    padding: 6px 12px;
    margin: 0 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
  }

  .play:active {
    border: 2px solid #000;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
  }

  .menulower {
    display: grid;
    width: 100%;
    margin-top: 10px;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid #555;
    border-left: 1px solid #555;
  }

  .menulower .play {
    margin: 0;
    border-left: none;
    border-top: none;
  }

  .menulower .play.is-playing {
    background-color: #c0c0c0;
    border: 2px solid #000;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
  }

  .playlist-selector {
    display: none;
    flex-direction: column;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    background: #e0e0e0;
    border: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #000;
    padding: 8px 8px 32px 8px; /* extra bottom padding */
    box-sizing: border-box;
    align-items: center;
    scrollbar-width: none;
  }

  .playlist-selector::-webkit-scrollbar {
    display: none;
  }

  .playlist-header {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .playlist-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    justify-items: center;
  }

  .playlist-grid img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #fff;
  }

  #player {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="music-player">
  <div class="player-top" id="playerArea">
    <div id="album-art" class="placeholder">Album</div>
    <div class="info-area">
      <button class="play playlist-btn" id="menuBtn" onclick="togglePlaylistSelector()" title="Pick Playlist">☰</button>
      <div id="song-title">Click Play</div>
      <div id="song-artist">&nbsp;</div>
    </div>
  </div>

  <div class="menulower" id="playerControls">
    <button class="play" onclick="prev()">⏮</button>
    <button class="play" id="playBtn" onclick="toggle()">▶</button>
    <button class="play" onclick="next()">⏭</button>
  </div>

  <div class="playlist-selector" id="playlistSelector">
    <div class="playlist-header">Pick a playlist!</div>
    <div class="playlist-grid">
      <img src="cd1.jpg" alt="CD 1" onclick="selectPlaylist('PL6HSWhn3OZ6FOyvoe-NjNlRB7i7-Vm5xG')">
      <img src="cd2.jpg" alt="CD 2" onclick="selectPlaylist('PLXXXXXXXXXXXX')">
      <img src="cd3.jpg" alt="CD 3" onclick="selectPlaylist('PLYYYYYYYYYYYY')">
      <img src="cd4.jpg" alt="CD 4" onclick="selectPlaylist('PLZZZZZZZZZZZZ')">
      <img src="cd5.jpg" alt="CD 5" onclick="selectPlaylist('PLAAAAAAAAAAAA')">
      <img src="cd6.jpg" alt="CD 6" onclick="selectPlaylist('PLBBBBBBBBBBBB')">
    </div>
  </div>
</div>

<div id="player" aria-hidden="true"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
let currentPlaylist = '';

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    playerVars: {
      listType: 'playlist',
      list: currentPlaylist,
      controls: 0,
      autoplay: 0,
      disablekb: 1
    },
    events: {
      onReady: e => e.target.setVolume(20),
      onStateChange: updateInfo
    }
  });
}

function togglePlaylistSelector() {
  const selector = document.getElementById('playlistSelector');
  const controls = document.getElementById('playerControls');
  const album = document.getElementById('album-art');
  const menu = document.getElementById('menuBtn');
  const title = document.getElementById('song-title');
  const artist = document.getElementById('song-artist');

  if (selector.style.display === 'flex') {
    selector.style.display = 'none';
    controls.style.display = 'grid';
    album.style.display = 'flex';
    menu.style.display = 'flex';
    title.style.display = player.getPlayerState() === YT.PlayerState.PLAYING ? 'block' : 'none';
    artist.style.display = player.getPlayerState() === YT.PlayerState.PLAYING ? 'block' : 'none';
  } else {
    selector.style.display = 'flex';
    controls.style.display = 'none';
    album.style.display = 'none';
    menu.style.display = 'none';
    title.style.display = 'none';
    artist.style.display = 'none';
  }
}

function selectPlaylist(listId) {
  currentPlaylist = listId;
  document.getElementById('playlistSelector').style.display = 'none';
  document.getElementById('playerControls').style.display = 'grid';
  document.getElementById('album-art').style.display = 'flex';
  document.getElementById('menuBtn').style.display = 'flex';
  player.loadPlaylist({ list: currentPlaylist });
  player.playVideo();
}

function toggle() {
  const state = player.getPlayerState();
  if (state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}

function next() { player.nextVideo(); }
function prev() { player.previousVideo(); }

function updateInfo(e) {
  const state = player.getPlayerState();
  const titleEl = document.getElementById('song-title');
  const artistEl = document.getElementById('song-artist');
  const playBtn = document.getElementById('playBtn');

  if (state === YT.PlayerState.PLAYING) {
    const data = player.getVideoData();
    if (data && data.video_id) {
      titleEl.textContent = data.title;
      artistEl.textContent = 'Uploaded by ' + data.author;
      if(document.getElementById('playlistSelector').style.display !== 'flex') {
        titleEl.style.display = 'block';
        artistEl.style.display = 'block';
      }
      playBtn.classList.add('is-playing');
    }
  } else {
    titleEl.style.display = 'none';
    artistEl.style.display = 'none';
    playBtn.classList.remove('is-playing');
  }
}
</script>

</body>
</html>
