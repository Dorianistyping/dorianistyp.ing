<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Only Player</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'w95fa', monospace;
  }

  #music-player {
    width: 607px;
    padding: 8px;
  }

  .player-top {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px;
  }

  #album-art {
    width: 120px;
    height: 120px;
    background: #000;
  }

  #album-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #song-title {
    display: none;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #song-artist {
    display: none;
    font-size: 12px;
    margin-bottom: 10px;
    color: #333;
  }

  .playlist-btn {
    width: 24px;
    height: 24px;
    padding: 0;
    margin: 0;
    font-size: 14px;
    line-height: 1;
    position: absolute;
    top: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }


  .playlist-menu {
    display: none;
    position: absolute;
    top: 26px;
    right: 0;
    background: #e0e0e0;
    border: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #000;
    padding: 4px;
    z-index: 10;
  }

  .playlist-menu select {
    width: 100%;
    font-family: inherit;
  }

  .play {
    border: 2px solid #fff;
    border-right: 2px solid #000;
    border-bottom: 2px solid #000;
    background-color: #e0e0e0;
    padding: 6px 12px;
    margin: 0 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
  }

  .play:active {
    border: 2px solid #000;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
  }

  #player {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  .menulower {
    display: grid;
    width: 100%;
    margin-top: 10px;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid #555;
    border-left: 1px solid #555;
  }

  .menulower .play {
    margin: 0;
    border-left: none;
    border-top: none;
   .menulower .play.is-playing {
    background-color: #c0c0c0;
    border: 2px solid #000;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
  }
}
</style>
</head>
<body>

<div id="music-player">
  <div class="player-top">
  <div id="album-art"><img id="album-img" src="" alt=""></div>

    <div class="info-area" style="position:relative;">

  <button class="play playlist-btn" onclick="togglePlaylistMenu()" title="Playlists">☰</button>
    <div class="playlist-menu" id="playlistMenu">
      <select id="playlistSelect" onchange="changePlaylist()">
        <option value="PL6HSWhn3OZ6FOyvoe-NjNlRB7i7-Vm5xG">Playlist 1</option>
        <option value="PLXXXXXXXXXXXX">Playlist 2</option>
      </select>
    </div>

  <div id="song-title">Click Play</div>
    <div id="song-artist">&nbsp;</div>

    

      </div>
  </div>

  <div class="menulower">
    <button class="play" onclick="prev()">⏮</button>
    <button class="play" id="playBtn" onclick="toggle()">▶</button>
    <button class="play" onclick="next()">⏭</button>
  </div>
</div>

<div id="player" aria-hidden="true"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
let currentPlaylist = document.getElementById('playlistSelect').value;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    playerVars: {
      listType: 'playlist',
      list: currentPlaylist,
      controls: 0,
      autoplay: 0,
      disablekb: 1
    },
    events: {
      onReady: e => e.target.setVolume(20),
      onStateChange: updateInfo
    }
  });
}

function changePlaylist() {
  currentPlaylist = document.getElementById('playlistSelect').value;
  player.loadPlaylist({ list: currentPlaylist });
}

function toggle() {
  const state = player.getPlayerState();
  if (state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}

function next() { player.nextVideo(); }
function prev() { player.previousVideo(); }

function updateInfo(e) {
  const state = player.getPlayerState();
  const titleEl = document.getElementById('song-title');
  const artistEl = document.getElementById('song-artist');
  const playBtn = document.getElementById('playBtn');

  if (state === YT.PlayerState.PLAYING) {
    const data = player.getVideoData();
    if (data && data.video_id) {
      titleEl.textContent = data.title;
      artistEl.textContent = 'Uploaded by ' + data.author;
      document.getElementById('album-img').src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
      titleEl.style.display = 'block';
      artistEl.style.display = 'block';
      playBtn.classList.add('is-playing');
    }
  } else {
    titleEl.style.display = 'none';
    artistEl.style.display = 'none';
    playBtn.classList.remove('is-playing');
  }
}
</script>

</body>
</html>
