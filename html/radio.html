<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audio Only Player</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'w95fa', monospace;
}

#music-player {
  width: 520px;
  padding: 8px;
}

.player-top {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 8px;
}

#album-art {
  width: 60px;
  height: 60px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  border: 2px solid #fff;
  border-right: 2px solid #000;
  border-bottom: 2px solid #000;
}

#album-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.info-area {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

#song-title, #song-artist {
  display: none;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

#song-title {
  font-size: 16px;
  font-weight: bold;
  margin-top: 8px;
}

#song-artist {
  font-size: 12px;
  margin-top: 2px;
  color: #333;
}

.play {
  border: 2px solid #fff;
  border-right: 2px solid #000;
  border-bottom: 2px solid #000;
  background-color: #e0e0e0;
  padding: 6px 12px;
  margin: 0 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
}

.play:active {
  border: 2px solid #000;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
}

.menulower {
  display: grid;
  width: 100%;
  margin-top: 10px;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid #555;
  border-left: 1px solid #555;
}

.menulower .play {
  margin: 0;
  border-left: none;
  border-top: none;
}

.menulower .play.is-playing {
  background-color: #c0c0c0;
  border: 2px solid #000;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
}

#player {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="music-player">
  <div class="player-top">
    <div id="album-art" class="placeholder">Album</div>
    <div class="info-area">
      <div id="song-title">Click Play</div>
      <div id="song-artist">&nbsp;</div>
    </div>
  </div>

  <div class="menulower">
    <button class="play" onclick="prev()">⏮</button>
    <button class="play" id="playBtn" onclick="toggle()">▶</button>
    <button class="play" onclick="next()">⏭</button>
  </div>
</div>

<div id="player" aria-hidden="true"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
let currentPlaylist = ''; // empty initially

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    playerVars: {
      listType: 'playlist',
      list: currentPlaylist,
      controls: 0,
      autoplay: 0,
      disablekb: 1
    },
    events: {
      onReady: e => e.target.setVolume(20),
      onStateChange: updateInfo
    }
  });
}

function toggle() {
  if (!currentPlaylist) return;
  const state = player.getPlayerState();
  if (state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}

function next() {
  if (currentPlaylist && player && typeof player.nextVideo === 'function') player.nextVideo();
}

function prev() {
  if (currentPlaylist && player && typeof player.previousVideo === 'function') player.previousVideo();
}

function updateInfo() {
  const state = player.getPlayerState();
  const titleEl = document.getElementById('song-title');
  const artistEl = document.getElementById('song-artist');
  const playBtn = document.getElementById('playBtn');

  if (state === YT.PlayerState.PLAYING) {
    const data = player.getVideoData();
    if (data && data.video_id) {
      titleEl.textContent = data.title;
      artistEl.textContent = 'Uploaded by ' + data.author;
      titleEl.style.display = 'block';
      artistEl.style.display = 'block';
      playBtn.classList.add('is-playing');
      document.getElementById('album-art').innerHTML = `<img src="https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg" alt="album">`;
    }
  } else {
    titleEl.style.display = 'none';
    artistEl.style.display = 'none';
    playBtn.classList.remove('is-playing');
  }
}
</script>

</body>
</html>
